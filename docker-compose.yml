# Proxy Usage: usage analytics, request monitor, and quota for CLIProxyAPI, reading from
# CPA Manager Plus (Full Mode).
#
#   docker compose up -d --build
#   open http://127.0.0.1:18320                     (local)
#   open https://cpa-usage.<tailnet>.ts.net         (tailnet, via the tailscale sidecar below)
#
# Settings come from .env (see .env.example).
services:
  proxy-usage:
    build: .
    image: proxy-usage:local
    container_name: proxy-usage
    restart: unless-stopped
    ports:
      # Loopback by default: the tailnet reaches the app through the tailscale sidecar over the
      # compose network, not this port. Set BIND_ADDR=0.0.0.0 to also expose it on the LAN and
      # on the Mac's own tailnet IP (http://<mac>.<tailnet>.ts.net:18320).
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-18320}:18320"
    environment:
      PORT: "18320"
      HOST: "0.0.0.0"
      # The Manager Server listens on the Mac's loopback; host.docker.internal reaches it from the
      # container (OrbStack / Docker Desktop, and Linux via the host-gateway mapping below).
      MANAGER_URL: "${MANAGER_URL:-http://host.docker.internal:18317}"
      # Extra hostnames to accept besides localhost, *.ts.net and *.local (comma separated).
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18320/"]
      interval: 15s
      timeout: 3s
      retries: 3

  # Tailscale sidecar: joins the tailnet as its own machine (TS_HOSTNAME) and uses Tailscale Serve
  # (tailnet only, never Funnel) to proxy https://<TS_HOSTNAME>.<tailnet>.ts.net to the app at
  # http://proxy-usage:18320 on the compose network. It has its own network namespace, so the app
  # can be restarted or recreated independently and local access never depends on Tailscale.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: proxy-usage-tailscale
    hostname: ${TS_HOSTNAME:-cpa-usage}
    restart: unless-stopped
    depends_on:
      proxy-usage:
        condition: service_started
    environment:
      # Only used for the first join; afterwards the node identity lives in ./tailscale/state.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-cpa-usage}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
